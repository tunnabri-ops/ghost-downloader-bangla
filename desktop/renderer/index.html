<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Downloader Bangla</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>👻 Ghost Downloader <span>Bangla</span></h1>
  <p class="sub">ডাইরেক্ট লিংক • M3U8 • YouTube — সব এক জায়গায়</p>
</header>
<main>
  <div id="updateBanner" class="update-banner" hidden>
    <span id="updateText"></span>
    <span class="update-btns">
      <button id="openRelease" type="button">⬇ রিলিজ পাতা খুলুন</button>
      <button id="dismissUpdate" type="button" class="ghost small">পরে</button>
    </span>
  </div>
  <p id="updateNote" class="hint" hidden></p>
  <section class="add-box">
    <input id="url" type="text" placeholder="ডাউনলোড লিংক বসান… (https://…)" autocomplete="off">
    <select id="kind">
      <option value="auto">অটো চিনবে</option>
      <option value="direct">ডাইরেক্ট ফাইল</option>
      <option value="m3u8">M3U8 ভিডিও</option>
      <option value="video">YouTube / ভিডিও (yt-dlp)</option>
      <option value="audio">শুধু অডিও MP3 (yt-dlp)</option>
    </select>
    <button id="add">⬇ ডাউনলোড</button>
    <button id="openFolder" class="ghost">📂 ফোল্ডার</button>
    <button id="checkUpdate" class="ghost">🔄 আপডেট চেক</button>
  </section>
  <p class="hint" id="dirHint"></p>
  <section id="list"></section>
  <p class="empty" id="empty">এখনো কোনো ডাউনলোড নেই — উপরে লিংক বসিয়ে শুরু করুন।</p>
  <h2>📜 ইতিহাস</h2>
  <input id="historySearch" type="text" placeholder="ইতিহাসে খুঁজুন… (ফাইলের নাম বা লিংক)" autocomplete="off">
  <ul id="history"></ul>
</main>
<footer>
  <p>নোট: YouTube / Facebook / TikTok ডাউনলোডে <b>yt-dlp</b> ইনস্টল থাকতে হবে (<code>pip install -U yt-dlp</code>)। এনক্রিপ্টেড M3U8 সমর্থিত নয়। কিছু সাইট সরাসরি ডাউনলোড ব্লক করে।</p>
</footer>
<script src="renderer.js"></script>
</body>
</html>
